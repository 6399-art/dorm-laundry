<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>宿舍洗衣機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: neo-brutalist. Yellow ground with two flat colour shapes behind. Floor cards carry a coloured folder tab; every control has a thick ink outline and a hard offset shadow. */
:root{
  --bg:#FFD21F; --paper:#FBF9F4; --ink:#111111; --fg:#111111; --muted:#5a5466;
  --yellow:#FFD21F; --pink:#FF4F7B; --purple:#8567F7; --green:#3FC83A;
  --on-accent:#111111;
  --free-bg:#C6F2BD; --run-bg:#D9CCFF; --soon-bg:#FFE48A; --done-bg:#FFC2D1; --fault-bg:#E4E1E8; --grace-bg:#B5E8D5; --held-bg:#BFE3FF;
  --free-t:#0b6b25; --soon-t:#8a4a00; --bad-t:#b3123a;
  --hatch:rgba(17,17,17,.14);
  --deco-a:#FF4F7B; --deco-b:#8567F7;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121f; --paper:#221c2f; --ink:#f3eee4; --fg:#f3eee4; --muted:#b5adc6;
    --free-bg:#1f4a2c; --run-bg:#3b2f72; --soon-bg:#5c4a0e; --done-bg:#6d2139; --fault-bg:#34303c; --grace-bg:#1d5a45; --held-bg:#1c3b57;
    --free-t:#7be495; --soon-t:#f5c35c; --bad-t:#ff8aa5;
    --hatch:rgba(243,238,228,.16);
    --deco-a:#3b1a34; --deco-b:#2b2354;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16121f; --paper:#221c2f; --ink:#f3eee4; --fg:#f3eee4; --muted:#b5adc6;
  --free-bg:#1f4a2c; --run-bg:#3b2f72; --soon-bg:#5c4a0e; --done-bg:#6d2139; --fault-bg:#34303c; --grace-bg:#1d5a45; --held-bg:#1c3b57;
  --free-t:#7be495; --soon-t:#f5c35c; --bad-t:#ff8aa5;
  --hatch:rgba(243,238,228,.16);
  --deco-a:#3b1a34; --deco-b:#2b2354;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg);
  font:500 15px/1.5 var(--sans);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none}
body::before{width:340px;height:340px;border-radius:50%;left:-200px;top:110px;background:var(--deco-a)}
body::after{right:0;bottom:0;width:min(70vw,480px);height:36vh;background:var(--deco-b);clip-path:polygon(0 30%,100% 0,100% 100%,0 100%)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.app{max-width:600px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:16px}
svg{display:block;flex:none}

/* pressable controls */
.linkbtn,.seg button,.sel select,.chips button,.btn,.mini button,.x,.fld input{
  border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--fg);
  box-shadow:3px 3px 0 var(--ink);
}
.linkbtn,.seg button,.chips button,.btn,.mini button,.x{transition:transform .08s,box-shadow .08s}
.linkbtn:active,.seg button:active,.chips button:active,.btn:active,.mini button:active,.x:active,.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"],.mini button[aria-pressed="true"]{background:var(--yellow);color:var(--on-accent)}

.top{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.top h1{margin:0;font-size:34px;line-height:1.1;font-weight:900;letter-spacing:-.01em;user-select:none;-webkit-user-select:none}
.tag{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--on-accent);background:var(--pink);border:2.5px solid var(--ink);padding:1px 10px;border-radius:99px}
.linkbtn{margin-left:auto;height:40px;padding:0 14px;font-size:14px;font-weight:800}

.conn{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;min-height:28px}
.dot{position:relative;width:16px;height:16px;border-radius:50%;background:var(--green);border:2.5px solid var(--ink)}
.dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2.5px solid var(--green);opacity:0;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.conn .ct{font-size:16px;font-weight:800}
.conn .upd{font:500 14px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.conn.off .dot{background:var(--pink)}
.conn.off .dot::after{border-color:var(--pink);animation:none;opacity:0}
.conn.off .ct{color:var(--bad-t)}

.filters{display:flex;flex-wrap:wrap;gap:10px}
.sel{position:relative;flex:1 1 130px;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:48px;padding:0 38px 0 14px;font-size:16px;font-weight:800}
.sel svg{position:absolute;right:12px;top:50%;margin-top:-8px;pointer-events:none;color:var(--fg)}
.seg{display:flex;gap:10px}
.seg button{height:48px;min-width:48px;padding:0 14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.gseg{width:100%}
.gseg button{flex:1;height:54px;font-weight:900;font-size:18px}
.gseg button[aria-pressed="true"]{background:var(--pink);color:var(--on-accent)}

.list{display:flex;flex-direction:column;gap:14px}
.card{position:relative;margin-top:14px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);--tab:var(--pink)}
.card::before{content:"";position:absolute;left:16px;top:-17px;width:68px;height:17px;background:var(--tab);border:3px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0}
.card.f3{--tab:var(--purple)}
.card.f4{--tab:var(--green)}
.card-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border:0;background:none;text-align:left}
.card-h .nm{font-size:24px;font-weight:900}
.gtag{font-size:12px;font-weight:800;background:var(--yellow);color:var(--on-accent);border:2px solid var(--ink);padding:0 9px;border-radius:99px}
.card-h .chev{margin-left:auto;color:var(--fg);transition:transform .2s}
.card-h[aria-expanded="false"] .chev{transform:rotate(180deg)}
.card-b{border-top:3px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:16px}
.sums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:14px;border-bottom:2.5px solid var(--ink)}
.sums.one{grid-template-columns:1fr}
.sum .hd{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:15px;font-weight:700}
.sum .cnt{font-size:26px;font-weight:900;line-height:1.3;margin-top:4px;font-variant-numeric:tabular-nums}
.sum .sub{font-size:14px;font-weight:700}
.sum.ok .sub{color:var(--free-t)}
.sum.warn .sub{color:var(--soon-t)}
.sum.none .sub{color:var(--muted)}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:16px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;width:100%;min-height:86px;padding:10px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);text-align:left;transition:transform .08s,box-shadow .08s}
.tile:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.tile .no{font-size:28px;font-weight:900;line-height:1.1}
.tile .lbl{font-size:13px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.tile .ic{position:absolute;top:10px;right:8px;display:flex;gap:6px;color:var(--fg)}
.tile .ic .bell{color:var(--fg)}
.s-free{background:var(--free-bg)}
.s-run{background:var(--run-bg)}
.s-soon{background:var(--soon-bg)}
.s-done{background:var(--done-bg)}
.s-grace{background:var(--grace-bg)}.s-held{background:var(--held-bg)}
.tile.s-grace,.tile.s-held{border-style:dashed}
.pill.grace{background:var(--grace-bg)}.pill.held{background:var(--held-bg)}
.done-alert.grace-alert{background:var(--grace-bg);border-color:#1b7a52;box-shadow:5px 5px 0 #1b7a52;color:var(--fg)}
.grace-alert .da-title,.grace-alert .da-copy{color:var(--fg)}
.note.good{color:#1b7a52;font-weight:900}
.qp{display:grid;gap:10px;margin:0 0 12px}.qp:empty{display:none}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-size:14px;font-weight:800}
.qrow.mine{background:var(--free-bg)}
.qb{flex:none;padding:8px 12px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);font:inherit;font-weight:900;cursor:pointer}
.qb.primary{background:var(--pink,#FF4F79);color:#fff}
.qb:disabled{opacity:.5}
/* 洗衣完成：加強對比、提示動畫與固定提醒 */
.tile.s-done{
  border:3px solid #b3123a;
  background:linear-gradient(135deg,#ffe1e8 0%,#ff9bb3 100%);
  box-shadow:4px 4px 0 #b3123a;
  animation:none;
}
.tile.s-done.watched-done{animation:donePulse 1.8s ease-in-out infinite}
.tile.s-done .lbl{font-size:14px;font-weight:900;color:#74102a}
.tile.s-done .no{color:#74102a}
@keyframes donePulse{
  0%,100%{box-shadow:4px 4px 0 #b3123a,0 0 0 0 rgba(179,18,58,.22)}
  50%{box-shadow:4px 4px 0 #b3123a,0 0 0 6px rgba(179,18,58,0)}
}
.done-alert{
  display:flex;align-items:flex-start;gap:12px;padding:15px;
  border:3px solid #8f0c2b;border-radius:16px;
  background:linear-gradient(135deg,#ffccd8,#ff8da8);color:#4c0719;
  box-shadow:5px 5px 0 #8f0c2b;
}
.done-alert .da-icon{font-size:30px;line-height:1;flex:none}
.done-alert .da-title{font-size:18px;font-weight:900;line-height:1.35}
.done-alert .da-copy{margin-top:4px;font-size:14px;font-weight:800;line-height:1.5}
.done-alert .da-list{margin-top:6px;font-size:13px;font-weight:900}
.done-alert[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.tile.s-done{animation:none}}

.s-fault{background:repeating-linear-gradient(135deg,var(--fault-bg) 0 7px,var(--hatch) 7px 9px)}
.bar{height:10px;border:2px solid var(--ink);border-radius:99px;background:var(--paper);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .9s linear}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{outline:4px solid var(--purple);outline-offset:3px}100%{outline:4px solid transparent;outline-offset:3px}}
.stale #list{opacity:.55}
.empty{padding:32px 16px;text-align:center;font-weight:700;border:3px dashed var(--ink);border-radius:18px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(10,8,16,.55)}
.panel{position:relative;width:min(100%,520px);max-height:92%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.sheet{align-items:center}.panel{border-bottom:3px solid var(--ink);border-radius:24px;padding:24px;box-shadow:6px 6px 0 var(--ink)}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ph h2{margin:0;font-size:26px;font-weight:900}
.ph .where{color:var(--muted);font-size:14px;font-weight:700}
.x{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none}
.pill{display:inline-block;margin-top:14px;padding:2px 14px;border:2.5px solid var(--ink);border-radius:99px;font-size:14px;font-weight:800;color:var(--fg)}
.pill.free{background:var(--free-bg)}
.pill.run{background:var(--run-bg)}
.pill.soon{background:var(--soon-bg)}
.pill.fault{background:var(--fault-bg)}
.pill.done{background:var(--done-bg)}
.big{font:500 48px/1.1 var(--mono);font-variant-numeric:tabular-nums;margin-top:14px}
.eta{margin:6px 0 0;color:var(--muted);font-size:14px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chips button{height:42px;padding:0 14px;font-weight:800}
.note{margin:14px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.note.bad{color:var(--bad-t);font-weight:700}
.acts{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.btn{height:50px;font-weight:800;font-size:16px}
.btn.primary{background:var(--yellow);color:var(--on-accent)}
.btn.danger{background:var(--pink);color:var(--on-accent)}
.btn:disabled{opacity:.5;box-shadow:none;cursor:not-allowed;transform:none}
.fld{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px}
.fld label{font-size:14px;font-weight:700}
.fld input{width:88px;height:50px;padding:0 10px;font:500 16px var(--mono)}
.fld .btn{flex:1;min-width:140px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,16px);max-width:min(92vw,440px);padding:12px 16px;border:2.5px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:4px 4px 0 var(--purple);font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* admin */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{display:flex;flex-direction:column;gap:2px;padding:12px;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);background:var(--paper)}
.st b{font-size:32px;line-height:1.1;font-weight:900;font-variant-numeric:tabular-nums}
.st span{font-size:13px;font-weight:800}
.st.free{background:var(--free-bg)}
.st.run{background:var(--run-bg)}
.st.done{background:var(--done-bg)}
.st.fault{background:var(--fault-bg)}
.ctrl{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink)}
.ctrl h2,.sech{margin:0;font-size:22px;font-weight:900}
.prow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.prow .pl{font-size:14px;font-weight:700}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini button{height:40px;padding:0 12px;font-size:14px;font-weight:800}
.mini button:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}

@media (prefers-reduced-motion:reduce){
  .dot::after{animation:none}.flash{animation:none}
  .bar i,.toast,.card-h .chev,.tile,.linkbtn,.seg button,.chips button,.btn,.mini button,.x{transition:none}
}
</style>

<main class="app" id="app">
  <div class="view" id="userView">
    <header class="top"><h1 id="userTitle">宿舍洗衣機</h1></header>
    <div class="conn" id="conn" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span class="ct" id="connText">即時連線</span>
      <span class="upd" id="upd">更新於 --:--:--</span>
    </div>
    <section class="done-alert" id="doneAlert" role="alert" aria-live="assertive" hidden>
      <span class="da-icon" aria-hidden="true">🔔</span>
      <div>
        <div class="da-title" id="doneAlertTitle">有衣物洗好了，請盡快取走！</div>
        <div class="da-copy">洗衣完成不代表機台已空出，取走衣物後請在畫面中點選機台並按「我已取走衣物」。</div>
        <div class="da-list" id="doneAlertList"></div>
      </div>
    </section>
    <div class="view" id="uFilters"></div>
    <section class="qp" id="queuePanel" aria-live="polite"></section>
    <section class="list" id="list" aria-label="機台列表"><div class="empty">連線中…</div></section>
  </div>

  <div class="view" id="adminView" hidden>
    <header class="top"><h1>宿舍洗衣機</h1><span class="tag">後台</span><button type="button" class="linkbtn" id="toUser">回到使用者畫面</button></header>

    <section class="stats" aria-label="全部機台統計">
      <div class="st free"><b id="stFree">0</b><span>空機</span></div>
      <div class="st run"><b id="stRun">0</b><span>運轉中</span></div>
      <div class="st done"><b id="stDone">0</b><span>未取出</span></div>
      <div class="st fault"><b id="stFault">0</b><span>故障停用</span></div>
    </section>

    <section class="ctrl" aria-label="情境控制">
      <h2>情境控制</h2>
      <div class="prow"><span class="pl">時間速度</span>
        <div class="mini" id="speedSeg" role="group" aria-label="時間速度">
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="30" aria-pressed="false">30×</button>
          <button type="button" data-speed="120" aria-pressed="false">120×</button>
        </div>
      </div>
      <div class="prow"><span class="pl">洗好後等待拿取時間</span>
        <div class="mini" id="graceSeg" role="group" aria-label="等待拿取時間"><button type="button" data-grace="5" aria-pressed="false">5 分鐘</button><button type="button" data-grace="10" aria-pressed="true">10 分鐘</button></div>
      </div>
      <div class="prow"><span class="pl">其他住戶</span>
        <div class="mini"><button type="button" id="autoBtn" aria-pressed="false">自動模擬</button></div>
      </div>
      <div class="prow"><span class="pl">使用者畫面網路</span>
        <div class="mini"><button type="button" id="offBtn" aria-pressed="false">模擬斷線</button></div>
      </div>
      <div class="prow"><span class="pl">快速情境：<span id="scopeLbl"></span></span>
        <div class="mini">
          <button type="button" data-sc="occupy">佔用一台空機</button>
          <button type="button" data-sc="finish">讓一台立刻洗好</button>
          <button type="button" data-sc="fill">全部佔滿</button>
          <button type="button" data-sc="clear">全部清空</button>
        </div>
      </div>
      <div class="prow"><span class="pl">資料</span>
        <div class="mini"><button type="button" id="resetBtn">重設展示資料</button></div>
      </div>
    </section>

    <h2 class="sech">機台管理</h2>
    <div class="view" id="aFilters"></div>
    <section class="list" id="aList" aria-label="後台機台列表"></section>
  </div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sTitle" tabindex="-1"><div id="sBody"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var DORMS=[{id:'jing',g:'m',floors:[null],washer:4,dryer:4},{id:'ming',g:'f',floors:[2,3],washer:6,dryer:6}];
  var FLOORS=[2,3];
  var GN={m:'男宿',f:'女宿'};
  var TYPE={washer:'洗衣機',dryer:'烘衣機'};
  var PROG={washer:[{n:'洗衣一次',m:36,$:20}],

  /* shared state shape:
     {clock:{real,sim,speed}, offline:bool, machines:{id:{e,t,f}}}

     A machine whose e is in the past is waiting to be emptied ("未取出"). */
  function defaultState(){
    var T=SIM0,r=rng(7),mm={};
    LIST.forEach(function(m){mm[m.id]={e:0,t:m.total,f:0}});
    function run(id,rem,total){mm[id]={e:T+rem,t:total,f:0}}
    function done(id,waited){mm[id]={e:T-waited,t:BYID[id].total,f:0}}
    LIST.forEach(function(m){
      if(m.dorm==='jing')return;
      if(r()<.45)mm[m.id]={e:T+Math.floor(r()*m.total*.85)+90,t:m.total,f:0};
    });
    run('jing-0-w4',34*60+54,36*60);
    run('jing-0-d1',18*60+5,40*60);
    run('jing-0-d2',27*60+49,40*60);
    run('jing-0-d3',9*60+10,40*60);
    [4,9,15,22,28,33].forEach(function(min,i){if(i<6)run('ming-3-w'+(i+1),min*60+i*11+7,36*60)});
    [11,26,38].forEach(function(min,i){run('ming-3-d'+(i+1),min*60+i*13+5,40*60)});
    mm['jing-0-w3']={e:0,t:36*60,f:1};
    mm['ming-3-d4']={e:0,t:40*60,f:1};
    done('jing-0-w1',6*60+20);done('jing-0-d4',13*60+10);done('ming-3-d5',14*60+30);done('ming-2-w2',9*60);

  function simNow(s){var c=s.clock;return c.sim+(Date.now()-c.real)/1000*c.speed}
  function stateOf(id,s,t){
    var m=s.machines[id]||{e:0,t:BYID[id].total,f:0};

    if(!m.e){var h=(s.hold||{})[id];

  /* app state */

  var localSyncKey='dorm-laundry-local-sync-v1', localChannel=null, localSyncReady=false;
  try{if('BroadcastChannel' in window){localChannel=new BroadcastChannel(localSyncKey);localChannel.onmessage=function(ev){handleLocalSync(ev.data)}}}catch(e){localChannel=null}
  function sendLocalSync(kind){
    if(!S||!localOnly)return;
    var msg={key:localSyncKey,kind:kind||'state',state:S,at:Date.now()};
    try{if(localChannel)localChannel.postMessage(msg)}catch(e){}

  }
  function handleLocalSync(msg){
    if(!msg||msg.key!==localSyncKey)return;

      localSyncReady=true;
      var oldS=S;
      S=msg.state;
      ready=true;

  /* lists (shared by user view and admin view) */
  function sumInfo(d,fl,ty,data,t){
    var ms=LIST.filter(function(m){return m.dorm===d.id&&m.floor===fl&&m.type===ty});
    var good=ms.filter(function(m){return !(data.machines[m.id]||{}).f});
    var free=0,min=null,done=0,held=0;
    good.forEach(function(m){var st=stateOf(m.id,data,t);if(st.s==='free')free++;else if(isWait(st.s))done++;else if(st.s==='held')held++;else if(st.rem!=null&&(min==null||st.rem<min))min=st.rem});
    var broken=ms.length-good.length,extra=(done?' · '+done+' 台未取出':'')+(held?' · '+held+' 台保留中':'')+(broken?' · '+broken+' 台停用':'');
    var cnt=free+'/'+good.length+' 空機';
    if(free>0)return{cls:'ok',cnt:cnt,sub:'現在可用'+extra};
    if(min!=null)return{cls:'warn',cnt:cnt,sub:'約 '+Math.max(1,Math.ceil(min/60))+' 分鐘後有空機'+extra};

  function makeList(el,flt,opts){

  function scope(){

  function runDefault(m,T){var tot=PROG[m.type][0].m*60;return{e:T+tot,t:tot,f:0}}
  function scenario(kind){
    if(!ready)return;
    var T=simNow(S),ms=scope(),patch={},n=0,pick;
    function st(m){return stateOf(m.id,S,T)}
    if(kind==='occupy'){
      var free=ms.filter(function(m){return st(m).s==='free'});
      if(!free.length){toast('這個範圍沒有空機可以佔用');return}
      pick=free[Math.floor(Math.random()*free.length)];
      patch[pick.id]=runDefault(pick,T);toast('有住戶開始使用 '+label(pick));
    }else if(kind==='finish'){
      var running=ms.filter(function(m){var s=st(m);return s.s==='run'||s.s==='soon'}).sort(function(a,b){return st(a).rem-st(b).rem});
      if(!running.length){toast('這個範圍沒有運轉中的機台');return}
      pick=running[0];patch[pick.id]={e:T+4,t:Math.max(mval(pick.id).t||pick.total,pick.total),f:0};toast(label(pick)+' 幾秒後洗好');
    }else if(kind==='fill'){
      ms.forEach(function(m){if(st(m).s==='fault')return;var tot=m.total;patch[m.id]={e:T+Math.floor(180+Math.random()*(tot-240)),t:tot,f:0};n++});
      toast('已讓 '+n+' 台機器運轉中');
    }else if(kind==='clear'){
      ms.forEach(function(m){if(st(m).s==='fault')return;patch[m.id]={e:0,t:m.total,f:0};n++});
      toast('已清空 '+n+' 台機器');
    }
    write({machines:patch});
  }

  /* 線上排隊：全滿時加入；有機台釋出時依序保留 5 分鐘 */
  function qInfo(dorm,ty,data,t){
    var key=dorm.id+'-'+ty,free=0,n=0,mineM=null;
    LIST.forEach(function(m){
      if(m.dorm!==dorm.id||m.type!==ty||(data.machines[m.id]||{}).f)return;
      n++;var st=stateOf(m.id,data,t);
      if(st.s==='free')free++;
      if(st.s==='held'&&st.hold.u===ME)mineM={m:m,left:st.rem};
    });
    var q=(data.queue||{})[key]||[],pos=-1;
    q.forEach(function(x,i){if(x.u===ME)pos=i});
    return{n:n,free:free,mine:mineM,q:q.length,pos:pos};
  }

  function queueStep(){
    if(!ready||!S||S.offline||inflight>0)return;
    var T=simNow(S),H={},hp={},qp={},changed=false,sh=S.hold||{};
    Object.keys(sh).forEach(function(k){H[k]=sh[k]});
    DORMS.forEach(function(d){['washer','dryer'].forEach(function(ty){
      var key=d.id+'-'+ty,q=((S.queue||{})[key]||[]).slice(),qc=false,users={};
      var ms=LIST.filter(function(m){return m.dorm===d.id&&m.type===ty});
      ms.forEach(function(m){
        var h=H[m.id],mv=mval(m.id);
        if(h&&h.u){
          if(mv.f||mv.e||h.until<=T){
            if(h.until<=T&&!mv.e&&!mv.f)q=q.filter(function(x){return x.u!==h.u});
            H[m.id]={u:'',until:0};hp[m.id]=H[m.id];qc=true;changed=true;
          }else users[h.u]=1;
        }
      });
      ms.forEach(function(m){
        var mv=mval(m.id),h=H[m.id];
        if(mv.f||mv.e||(h&&h.u))return;
        for(var i=0;i<q.length;i++)if(!users[q[i].u]){H[m.id]={u:q[i].u,until:T+HOLD};hp[m.id]=H[m.id];users[q[i].u]=1;changed=true;return}
      });
      if(qc)qp[key]=q;
    })});
    if(changed)write({hold:hp,queue:qp});
  }

  function startLocal(){
    localOnly=true;S=defaultState();ready=true;renderAll();
    // 詢問另一個已開啟的分頁是否已有最新狀態；若沒有，送出本分頁的初始狀態。
    try{if(localChannel)localChannel.postMessage({key:localSyncKey,kind:'request'})}catch(e){}
    setTimeout(function(){if(!localSyncReady){localSyncReady=true;sendLocalSync('state')}},250);

  function connect(){
    var fb=setTimeout(function(){if(!ready)startLocal()},3500);
    if(!window.claude||!window.claude.use){clearTimeout(fb);startLocal();return}
    window.claude.use('db').then(function(d){
      if(!d){clearTimeout(fb);if(!ready)startLocal();return}
      doc=d.doc('laundry/state');
      doc.onSnapshot(function(snap){
        if(!snap.exists){
          if(!seeded){seeded=true;doc.set(defaultState()).catch(function(){if(!ready)startLocal()})}
          return;
        }
        clearTimeout(fb);localOnly=false;applySnap(snap.data());
      },function(err){if(window.console)console.error(err);if(!ready)startLocal()});
    }).catch(function(){if(!ready)startLocal()});
  }

  bindFilters($('#uFilters'),'u',uflt);
  bindFilters($('#aFilters'),'a',aflt);
  userList=makeList($('#list'),uflt,{bell:true});
  adminList=makeList($('#aList'),aflt,{bell:false});
  $('#userView').hidden=mode!=='user';$('#adminView').hidden=mode!=='admin';
  setInterval(tick,1000);
  connect();
})();
</script>
